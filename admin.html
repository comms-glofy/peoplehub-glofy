<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>People Hub — Admin</title>
<link rel="icon" href="https://raw.githubusercontent.com/comms-glofy/glofy-assets/refs/heads/main/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --dark:#212121;
    --dark2:#383838;
    --lime:#ceff00;
    --gray:#e1e1e1;
    --offwhite:#ededed;
    --danger:#ff6b5e;
    --warn:#ffb347;
    --ok:#8fe388;
    --radius:14px;
    --radius-sm:9px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Montserrat',sans-serif;
    background:var(--dark);
    color:var(--offwhite);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit; cursor:pointer; color:var(--offwhite);}
  input,select,textarea{font-family:inherit;}

  .screen{display:none; min-height:100vh;}
  .screen.active{display:flex; flex-direction:column;}

  /* login */
  #login-screen{align-items:center; justify-content:center; padding:24px;}
  .login-card{width:100%; max-width:380px; background:var(--dark2); border-radius:var(--radius); padding:40px 32px 32px; border:1px solid #454545;}
  .login-logo{display:flex; justify-content:center; margin-bottom:22px;}
  .login-logo img{height:28px;}
  .login-card h1{font-size:16px; font-weight:700; text-align:center; margin-bottom:4px;}
  .login-card p.sub{font-size:12px; color:#9c9c9c; text-align:center; margin-bottom:24px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:11px; font-weight:600; letter-spacing:.03em; text-transform:uppercase; color:#a8a8a8; margin-bottom:6px;}
  .field input, .field select, .field textarea{
    width:100%; background:#2c2c2c; border:1px solid #4a4a4a; border-radius:var(--radius-sm);
    padding:11px 13px; color:var(--offwhite); font-size:14px; outline:none; transition:border-color .15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--lime);}
  .field textarea{resize:vertical; min-height:60px;}
  .checkbox-row{display:flex; align-items:center; gap:8px; font-size:12.5px; color:#c8c8c8; margin-bottom:14px;}
  .checkbox-row input{width:auto;}
  .btn{width:100%; background:var(--lime); color:var(--dark); border:none; border-radius:var(--radius-sm); padding:12px 16px; font-weight:700; font-size:13.5px; transition:opacity .15s, transform .08s;}
  .btn:hover{opacity:.88;}
  .btn:active{transform:scale(.98);}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  .btn-outline{background:transparent; color:var(--offwhite); border:1px solid #4a4a4a;}
  .btn-outline:hover{border-color:var(--lime); color:var(--lime); opacity:1;}
  .btn-sm{width:auto; padding:8px 14px; font-size:12px;}
  .btn-danger{background:transparent; color:var(--danger); border:1px solid rgba(255,107,94,.4);}
  .btn-danger:hover{background:rgba(255,107,94,.1);}
  .btn-ok{background:var(--ok); color:#173318;}
  .error-msg{background:rgba(255,107,94,.12); border:1px solid rgba(255,107,94,.4); color:#ff9a8f; font-size:12.5px; padding:9px 12px; border-radius:var(--radius-sm); margin-bottom:14px; display:none;}
  .error-msg.show{display:block;}

  /* app shell */
  #app-screen{display:none;}
  #app-screen.active{display:flex; flex-direction:column;}
  header.topbar{display:flex; align-items:center; justify-content:space-between; padding:16px 28px; border-bottom:1px solid #333; position:sticky; top:0; background:var(--dark); z-index:20;}
  .topbar-left{display:flex; align-items:center; gap:14px;}
  .topbar-left img{height:22px;}
  .topbar-left .divider{width:1px; height:18px; background:#444;}
  .topbar-left .title{font-size:13px; font-weight:600; color:#c9c9c9;}
  main.container{width:100%; max-width:1080px; margin:0 auto; padding:28px 28px 80px;}

  .tabs{display:flex; gap:6px; margin-bottom:26px; border-bottom:1px solid #383838;}
  .tab-btn{background:none; border:none; padding:10px 4px; margin-right:22px; font-size:13.5px; font-weight:700; color:#8f8f8f; border-bottom:2px solid transparent;}
  .tab-btn.active{color:var(--offwhite); border-bottom-color:var(--lime);}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  .toolbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:12px; flex-wrap:wrap;}
  .filter-chips{display:flex; gap:8px;}
  .chip{background:var(--dark2); border:1px solid #454545; color:#bdbdbd; font-size:12px; font-weight:700; padding:6px 13px; border-radius:999px;}
  .chip.active{background:var(--lime); color:var(--dark); border-color:var(--lime);}

  .card-list{display:flex; flex-direction:column; gap:10px;}
  .req-card, .emp-card{background:var(--dark2); border:1px solid #3f3f3f; border-radius:var(--radius-sm); padding:14px 16px; display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;}
  .req-main, .emp-main{display:flex; flex-direction:column; gap:3px; min-width:200px;}
  .req-name, .emp-name{font-size:13.5px; font-weight:700;}
  .req-sub, .emp-sub{font-size:12px; color:#999;}
  .req-motivo{font-size:11.5px; color:#8a8a8a; font-style:italic; margin-top:2px;}
  .req-actions, .emp-actions{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .badge{font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px; white-space:nowrap;}
  .badge.Pendiente{background:rgba(255,179,71,.14); color:var(--warn);}
  .badge.Aprobado{background:rgba(143,227,136,.14); color:var(--ok);}
  .badge.Rechazado{background:rgba(255,107,94,.14); color:var(--danger);}
  .empty-state{border:1px dashed #454545; border-radius:var(--radius-sm); padding:26px; text-align:center; color:#888; font-size:13px;}

  .section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .section-head h2{font-size:18px; font-weight:700;}

  /* modal */
  .modal-overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); align-items:center; justify-content:center; z-index:100; padding:20px;}
  .modal-overlay.active{display:flex;}
  .modal{width:100%; max-width:440px; max-height:88vh; overflow-y:auto; background:var(--dark2); border:1px solid #4a4a4a; border-radius:var(--radius); padding:26px;}
  .modal-head{display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:18px;}
  .modal-head h3{font-size:16px; font-weight:700;}
  .modal-close{background:none; border:none; color:#999; font-size:18px; line-height:1;}
  .modal-actions{display:flex; gap:10px; margin-top:16px;}
  .modal-hint{font-size:11px; color:#8a8a8a; margin:-8px 0 14px;}

  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--dark2); border:1px solid var(--lime); color:var(--offwhite); padding:13px 20px; border-radius:var(--radius-sm); font-size:13px; font-weight:600; opacity:0; pointer-events:none; transition:all .25s; z-index:200; box-shadow:0 8px 24px rgba(0,0,0,.4);}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  @media(max-width:640px){
    main.container{padding:22px 16px 70px;}
    header.topbar{padding:14px 16px;}
    .req-card, .emp-card{flex-direction:column; align-items:flex-start;}
  }
</style>
</head>
<body>

<!-- LOGIN -->
<section id="login-screen" class="screen active">
  <div class="login-card">
    <div class="login-logo">
      <img src="https://raw.githubusercontent.com/comms-glofy/glofy-assets/refs/heads/main/logo-rebrand-glofy.png" alt="Glofy">
    </div>
    <h1>People Hub — Admin</h1>
    <p class="sub">Solo para People / Comms</p>
    <div id="login-error" class="error-msg"></div>
    <form id="login-form">
      <div class="field">
        <label for="admin-password">Contraseña de administrador</label>
        <input type="password" id="admin-password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn" id="login-btn">Ingresar</button>
    </form>
  </div>
</section>

<!-- APP -->
<section id="app-screen" class="screen">
  <header class="topbar">
    <div class="topbar-left">
      <img src="https://raw.githubusercontent.com/comms-glofy/glofy-assets/refs/heads/main/logo-rebrand-glofy.png" alt="Glofy">
      <div class="divider"></div>
      <span class="title">People Hub — Admin</span>
    </div>
    <button class="btn btn-outline btn-sm" id="logout-btn">Salir</button>
  </header>

  <main class="container">
    <div class="tabs">
      <button class="tab-btn active" data-tab="solicitudes">Solicitudes</button>
      <button class="tab-btn" data-tab="colaboradores">Colaboradores</button>
    </div>

    <!-- SOLICITUDES -->
    <div class="tab-panel active" id="tab-solicitudes">
      <div class="toolbar">
        <div class="filter-chips" id="filter-chips">
          <button class="chip active" data-filter="Pendiente">Pendientes</button>
          <button class="chip" data-filter="Aprobado">Aprobadas</button>
          <button class="chip" data-filter="Rechazado">Rechazadas</button>
          <button class="chip" data-filter="Todas">Todas</button>
        </div>
        <button class="btn btn-outline btn-sm" id="refresh-requests-btn">Actualizar</button>
      </div>
      <div class="card-list" id="requests-list"></div>
    </div>

    <!-- COLABORADORES -->
    <div class="tab-panel" id="tab-colaboradores">
      <div class="section-head">
        <h2>Colaboradores</h2>
        <button class="btn btn-outline btn-sm" id="add-employee-btn">+ Agregar colaborador</button>
      </div>
      <div class="card-list" id="employees-list"></div>
    </div>
  </main>
</section>

<!-- MODAL: colaborador (alta/edición) -->
<div class="modal-overlay" id="employee-modal-overlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="employee-modal-title">Agregar colaborador</h3>
      <button class="modal-close" id="employee-modal-close">✕</button>
    </div>
    <div id="employee-modal-error" class="error-msg"></div>
    <form id="employee-form">
      <div class="field">
        <label>Nombre</label>
        <input type="text" name="nombre" required>
      </div>
      <div class="field">
        <label>Mail corporativo</label>
        <input type="email" name="email" required>
      </div>
      <div class="field">
        <label id="password-label">Contraseña</label>
        <input type="text" name="password" id="employee-password-input">
        <p class="modal-hint" id="password-hint">Se la vas a pasar por mail vos directamente.</p>
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="debe-cambiar" name="debeCambiarPassword">
        <label for="debe-cambiar">Pedirle que elija su propia contraseña al primer ingreso</label>
      </div>
      <div class="field">
        <label>Fecha de ingreso</label>
        <input type="date" name="fechaIngreso">
      </div>
      <div class="field">
        <label>Fecha de nacimiento</label>
        <input type="text" name="fechaNacimiento" placeholder="DD/MM, ej. 13/01">
      </div>
      <div class="field">
        <label>URL de foto de perfil (opcional)</label>
        <input type="text" name="fotoPerfil" placeholder="https://raw.githubusercontent.com/...">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="employee-modal-cancel">Cancelar</button>
        <button type="submit" class="btn" id="employee-modal-submit">Guardar</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ======================================================================
   CONFIG — misma URL de Apps Script que usa index.html
====================================================================== */
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbypWrDTeBaOsfKQe4uyeLVp_8mmfU__OXlJA-oFVAEYiU7zPOU04j5nySR7Nstjj6dl/exec"; // ej: "https://script.google.com/macros/s/XXXX/exec"

const LEAVE_TYPE_NAMES = {
  permiso_corto: "Permiso corto / ausencia programada",
  vacaciones: "Vacaciones",
  cumpleanos: "Medio día off por cumpleaños",
  salud: "Licencia o inconveniente de salud",
  permiso_especial: "Permiso especial",
  guardia: "Compensación por guardia",
  nacimiento_familiar: "Nacimiento o situación familiar",
  otras_especiales: "Otra licencia especial",
};

let adminPassword = null;
let currentFilter = "Pendiente";
let editingEmployeeRowNum = null; // null = modal en modo "agregar"

const $ = sel => document.querySelector(sel);
const el = (tag, cls, html) => { const e=document.createElement(tag); if(cls) e.className=cls; if(html!==undefined) e.innerHTML=html; return e; };

function showToast(msg){
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2800);
}

function fmtDate(str){
  if(!str) return "";
  const d = new Date(str+"T00:00:00");
  if (isNaN(d)) return str;
  return d.toLocaleDateString("es-AR",{ day:"2-digit", month:"short", year:"numeric" });
}

/* ======================================================================
   API layer
====================================================================== */
async function apiCall(action, payload){
  if (!APPS_SCRIPT_URL){
    throw new Error("Falta configurar APPS_SCRIPT_URL en admin.html — misma URL que en index.html.");
  }
  const res = await fetch(APPS_SCRIPT_URL, {
    method:"POST",
    headers:{ "Content-Type":"text/plain;charset=utf-8" },
    body: JSON.stringify({ action, adminPassword, ...payload })
  });
  if (!res.ok) throw new Error("Error de red");
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || "Error");
  return data;
}

/* ======================================================================
   LOGIN
====================================================================== */
$("#login-form").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const btn = $("#login-btn");
  const errBox = $("#login-error");
  errBox.classList.remove("show");
  btn.disabled = true; btn.textContent = "Ingresando...";
  try{
    adminPassword = $("#admin-password").value;
    await apiCall("adminLogin", {});
    $("#login-screen").classList.remove("active");
    $("#app-screen").classList.add("active");
    await loadRequests();
    await loadEmployees();
  }catch(err){
    adminPassword = null;
    errBox.textContent = err.message || "No pudimos validar la contraseña.";
    errBox.classList.add("show");
  }finally{
    btn.disabled = false; btn.textContent = "Ingresar";
  }
});

$("#logout-btn").addEventListener("click", ()=>{
  adminPassword = null;
  $("#app-screen").classList.remove("active");
  $("#login-screen").classList.add("active");
  $("#login-form").reset();
});

/* ======================================================================
   TABS
====================================================================== */
document.querySelectorAll(".tab-btn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
    document.querySelectorAll(".tab-panel").forEach(p=>p.classList.remove("active"));
    btn.classList.add("active");
    $("#tab-"+btn.dataset.tab).classList.add("active");
  });
});

/* ======================================================================
   SOLICITUDES
====================================================================== */
document.querySelectorAll(".chip").forEach(chip=>{
  chip.addEventListener("click", ()=>{
    document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
    chip.classList.add("active");
    currentFilter = chip.dataset.filter;
    renderRequests();
  });
});
$("#refresh-requests-btn").addEventListener("click", loadRequests);

let allRequests = [];

async function loadRequests(){
  try{
    const { requests } = await apiCall("adminListRequests", {});
    allRequests = requests;
    renderRequests();
  }catch(err){
    showToast(err.message || "No pudimos cargar las solicitudes.");
  }
}

function renderRequests(){
  const wrap = $("#requests-list");
  wrap.innerHTML = "";
  const filtered = currentFilter === "Todas" ? allRequests : allRequests.filter(r=>r.estado===currentFilter);

  if (!filtered.length){
    wrap.appendChild(el("div","empty-state","No hay solicitudes acá."));
    return;
  }

  filtered.forEach(r=>{
    const typeName = LEAVE_TYPE_NAMES[r.tipo] || r.tipo;
    const rango = r.fecha_fin && r.fecha_fin !== r.fecha_inicio ? `${fmtDate(r.fecha_inicio)} → ${fmtDate(r.fecha_fin)}` : fmtDate(r.fecha_inicio);
    const card = el("div","req-card",`
      <div class="req-main">
        <span class="req-name">${r.nombre} <span style="color:#888; font-weight:500;">· ${r.email}</span></span>
        <span class="req-sub">${typeName} — ${rango} (${r.dias} día/s)</span>
        ${r.motivo ? `<span class="req-motivo">"${r.motivo}"</span>` : ""}
      </div>
      <div class="req-actions">
        <span class="badge ${r.estado}">${r.estado}</span>
      </div>
    `);
    const actions = card.querySelector(".req-actions");
    if (r.estado !== "Aprobado"){
      const approveBtn = el("button","btn btn-ok btn-sm","Aprobar");
      approveBtn.addEventListener("click", ()=>updateStatus(r.rowNum, "Aprobado"));
      actions.prepend(approveBtn);
    }
    if (r.estado !== "Rechazado"){
      const rejectBtn = el("button","btn btn-danger btn-sm","Rechazar");
      rejectBtn.addEventListener("click", ()=>updateStatus(r.rowNum, "Rechazado"));
      actions.prepend(rejectBtn);
    }
    wrap.appendChild(card);
  });
}

async function updateStatus(rowNum, estado){
  try{
    await apiCall("adminUpdateRequestStatus", { rowNum, estado });
    showToast(estado === "Aprobado" ? "Solicitud aprobada — le avisamos por mail." : "Solicitud rechazada — le avisamos por mail.");
    await loadRequests();
  }catch(err){
    showToast(err.message || "No pudimos actualizar la solicitud.");
  }
}

/* ======================================================================
   COLABORADORES
====================================================================== */
let allEmployees = [];

async function loadEmployees(){
  try{
    const { employees } = await apiCall("adminListEmployees", {});
    allEmployees = employees;
    renderEmployees();
  }catch(err){
    showToast(err.message || "No pudimos cargar los colaboradores.");
  }
}

function renderEmployees(){
  const wrap = $("#employees-list");
  wrap.innerHTML = "";
  if (!allEmployees.length){
    wrap.appendChild(el("div","empty-state","Todavía no cargaste a nadie."));
    return;
  }
  allEmployees.forEach(emp=>{
    const card = el("div","emp-card",`
      <div class="emp-main">
        <span class="emp-name">${emp.nombre}</span>
        <span class="emp-sub">${emp.email} · ingresó ${fmtDate(emp.fechaIngreso) || "—"}${emp.debeCambiarPassword ? " · debe cambiar contraseña" : ""}</span>
      </div>
      <div class="emp-actions">
        <button class="btn btn-outline btn-sm">Editar</button>
      </div>
    `);
    card.querySelector("button").addEventListener("click", ()=>openEmployeeModal(emp));
    wrap.appendChild(card);
  });
}

$("#add-employee-btn").addEventListener("click", ()=>openEmployeeModal(null));

function openEmployeeModal(emp){
  editingEmployeeRowNum = emp ? emp.rowNum : null;
  $("#employee-modal-title").textContent = emp ? "Editar colaborador" : "Agregar colaborador";
  $("#employee-modal-error").classList.remove("show");
  const form = $("#employee-form");
  form.reset();
  if (emp){
    form.nombre.value = emp.nombre || "";
    form.email.value = emp.email || "";
    form.fechaIngreso.value = emp.fechaIngreso || "";
    form.fechaNacimiento.value = emp.fechaNacimiento ? emp.fechaNacimiento.split("-").reverse().join("/") : "";
    form.fotoPerfil.value = emp.fotoPerfil || "";
    form.debeCambiarPassword.checked = !!emp.debeCambiarPassword;
    $("#password-label").textContent = "Contraseña nueva (opcional)";
    $("#password-hint").textContent = "Dejalo vacío para no cambiar la contraseña actual.";
    form.password.required = false;
  } else {
    $("#password-label").textContent = "Contraseña";
    $("#password-hint").textContent = "Se la vas a pasar por mail vos directamente.";
    form.password.required = true;
  }
  $("#employee-modal-overlay").classList.add("active");
}

function closeEmployeeModal(){
  $("#employee-modal-overlay").classList.remove("active");
  $("#employee-form").reset();
  editingEmployeeRowNum = null;
}
$("#employee-modal-close").addEventListener("click", closeEmployeeModal);
$("#employee-modal-cancel").addEventListener("click", closeEmployeeModal);
$("#employee-modal-overlay").addEventListener("click", (e)=>{ if(e.target.id==="employee-modal-overlay") closeEmployeeModal(); });

$("#employee-form").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const fd = new FormData(e.target);
  const payload = {
    nombre: fd.get("nombre"),
    email: fd.get("email"),
    fechaIngreso: fd.get("fechaIngreso"),
    fechaNacimiento: fd.get("fechaNacimiento"),
    fotoPerfil: fd.get("fotoPerfil"),
    debeCambiarPassword: fd.get("debeCambiarPassword") === "on",
  };
  const password = fd.get("password");
  if (password) payload.password = password;

  const btn = $("#employee-modal-submit");
  btn.disabled = true; btn.textContent = "Guardando...";
  try{
    if (editingEmployeeRowNum){
      await apiCall("adminUpdateEmployee", { rowNum: editingEmployeeRowNum, ...payload });
      showToast("Colaborador actualizado.");
    } else {
      if (!password){
        throw new Error("La contraseña es obligatoria para alguien nuevo.");
      }
      await apiCall("adminAddEmployee", payload);
      showToast("Colaborador agregado.");
    }
    closeEmployeeModal();
    await loadEmployees();
  }catch(err){
    $("#employee-modal-error").textContent = err.message || "No pudimos guardar los datos.";
    $("#employee-modal-error").classList.add("show");
  }finally{
    btn.disabled = false; btn.textContent = "Guardar";
  }
});
</script>
</body>
</html>
